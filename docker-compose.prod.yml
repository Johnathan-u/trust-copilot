# Production deploy: docker compose -f docker-compose.prod.yml up -d --build
# Uses .env.production for all secrets and config.
# Operators must generate every secret in .env.production for each deployment (SESSION_SECRET, POSTGRES_PASSWORD and the
# DATABASE_URL password, MINIO_ROOT_USER/MINIO_ROOT_PASSWORD, S3_ACCESS_KEY/S3_SECRET_KEY, provider secrets), e.g. with
# `openssl rand -hex 32`. Every credential value ever committed to this repository is RETIRED (TC-07-001) and must never
# be reused. This file must never contain credential literals; a release test enforces it.

services:
  caddy:
    image: caddy:2
    container_name: tc-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - trustnet

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    container_name: tc-web
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NEXT_PUBLIC_APP_URL: https://trustcopilot.app
      API_UPSTREAM: http://api:8000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - trustnet

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: tc-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      TRUST_COPILOT_IN_DOCKER: "1"
      # TC-07-001: DATABASE_URL comes from .env.production (env_file); never inline credentials here.
      S3_ENDPOINT: http://minio:9000
      APP_BASE_URL: https://trustcopilot.app
      FRONTEND_URL: https://trustcopilot.app
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      - postgres
      - minio
    networks:
      - trustnet

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: tc-worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production  # TC-03-001: worker enforces the production config contract too
      TRUST_COPILOT_IN_DOCKER: "1"
      # TC-07-001: DATABASE_URL comes from .env.production (env_file); never inline credentials here.
      S3_ENDPOINT: http://minio:9000
    command: python -m app.worker
    # TC-03-003: the worker has no HTTP server; override the image's API probe with the
    # worker heartbeat-file probe (no HTTP, no DB). Fresh while the claim loop or a job within
    # WORKER_JOB_MAX_RUNTIME_SEC is progressing.
    healthcheck:
      test: ["CMD", "python", "-m", "app.probe", "worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - postgres
      - minio
    networks:
      - trustnet

  postgres:
    image: pgvector/pgvector:pg16
    container_name: tc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustcopilot
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env.production (see docs/release/tickets/TC-07-001.md)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production (see docs/release/tickets/TC-07-001.md)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - trustnet

  minio:
    image: minio/minio:latest
    container_name: tc-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env.production (see docs/release/tickets/TC-07-001.md)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env.production (see docs/release/tickets/TC-07-001.md)}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    networks:
      - trustnet

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  trustnet:
    driver: bridge
