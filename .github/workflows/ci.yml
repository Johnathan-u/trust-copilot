name: CI

on:
  push:
  pull_request:

# TC-02-SEC-001: read-only GITHUB_TOKEN by default. CI only reads the repo; no job here
# writes to it, so no job needs a write scope.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # TC-02-SEC-001: do not leave the token in .git/config for later steps.
          persist-credentials: false

      - name: Ensure no secrets files are committed
        run: |
          TRACKED=$(git ls-files | grep -E '^\.env$|^apps/api/\.env$' || true)
          if [ -n "$TRACKED" ]; then
            echo "ERROR: The following env files must not be committed: $TRACKED"
            exit 1
          fi
          echo "No committed .env files found."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Secret inventory tree scan (TC-07-001)
        # Early, dependency-free gate: fails the run on any block finding in tracked files. Output is
        # path, line, rule and kind only (never a value).
        run: python scripts/security/secret_inventory.py tree --root .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # TC-02-003: single source of truth for the frontend Node version.
          node-version-file: apps/web/.nvmrc

      - name: Install frontend deps
        working-directory: apps/web
        # TC-02-003: install exactly the lockfile; no dependency lifecycle scripts.
        run: npm ci --ignore-scripts

      - name: Frontend tool versions
        working-directory: apps/web
        # TC-02-006: record the exact gate toolchain in the CI log.
        run: |
          node --version
          npm --version
          npx --no-install tsc --version
          npx --no-install eslint --version
          npx --no-install prettier --version
          npx --no-install vitest --version

      - name: Lint frontend
        working-directory: apps/web
        run: npm run lint

      - name: Format check frontend
        working-directory: apps/web
        run: npm run format:check

      - name: Unit test frontend
        working-directory: apps/web
        run: npm run test:unit

      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files

      - name: Start isolated Postgres (pgvector) for this run
        # Disposable per-run database: fresh container, throwaway credentials generated here (never
        # committed, masked in logs), migrations applied below, removed when the runner is discarded.
        # Image pinned by digest (PostgreSQL 16.15 + pgvector 0.8.7) - same image family as docker-compose*.yml;
        # plain postgres:16 lacks the vector extension the migrations create.
        env:
          PG_IMAGE: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        run: |
          PG_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PG_PASSWORD"
          PG_DB="tc_ci_${{ github.run_id }}_${{ github.run_attempt }}_test"
          docker run -d --name tc-ci-pg \
            -e POSTGRES_USER=tc_ci -e POSTGRES_PASSWORD="$PG_PASSWORD" -e POSTGRES_DB="$PG_DB" \
            -p 127.0.0.1:5432:5432 "$PG_IMAGE"
          # The entrypoint's temporary initialization server accepts only socket connections.
          # Wait for the final TCP server used by the database URL below.
          for i in $(seq 1 60); do
            docker exec tc-ci-pg pg_isready -h 127.0.0.1 -U tc_ci -d "$PG_DB" >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec tc-ci-pg pg_isready -h 127.0.0.1 -U tc_ci -d "$PG_DB"
          URL="postgresql://tc_ci:$PG_PASSWORD@127.0.0.1:5432/$PG_DB"
          echo "DATABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "TC_TEST_DATABASE_URL=$URL" >> "$GITHUB_ENV"

      - name: Start isolated S3-compatible storage (moto) for this run
        # Disposable per-run object store. motoserver/moto is Apache-2.0 and test-only.
        # MinIO is not used (AGPL-3.0; tests/release/test_license_resolution.py).
        # Credentials are generated here, masked, and never committed. Buckets match
        # the test-raw / test-exports names set in apps/api/tests/conftest.py.
        env:
          S3_IMAGE: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
        run: |
          S3_ACCESS_KEY="$(openssl rand -hex 16)"
          S3_SECRET_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$S3_ACCESS_KEY"
          echo "::add-mask::$S3_SECRET_KEY"
          echo "Storage image: $S3_IMAGE"
          docker run -d --name tc-ci-s3 \
            -p 127.0.0.1:9000:5000 "$S3_IMAGE"
          # Bounded retry, then a mandatory final probe (same shape as the Postgres step).
          for i in $(seq 1 60); do
            curl -sf --connect-timeout 2 --max-time 15 -o /dev/null "http://127.0.0.1:9000/moto-api/" && break
            sleep 1
          done
          curl -sf --connect-timeout 2 --max-time 15 -o /dev/null "http://127.0.0.1:9000/moto-api/"
          docker exec \
            -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" \
            -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
            -e AWS_DEFAULT_REGION=us-east-1 \
            tc-ci-s3 python3 -c 'import os,boto3; from botocore.config import Config; c=boto3.client("s3", endpoint_url="http://127.0.0.1:5000", aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"], aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"], region_name="us-east-1", config=Config(signature_version="s3v4", s3={"addressing_style": "path"})); [(c.create_bucket(Bucket=b), c.head_bucket(Bucket=b)) for b in ("test-raw", "test-exports")]; print("buckets ready")'
          echo "TC_TEST_S3_ENDPOINT=http://127.0.0.1:9000" >> "$GITHUB_ENV"
          echo "TC_TEST_S3_ACCESS_KEY=$S3_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "TC_TEST_S3_SECRET_KEY=$S3_SECRET_KEY" >> "$GITHUB_ENV"

      - name: Install backend deps
        working-directory: apps/api
        run: |
          pip install -U pip
          # TC-02-002: exact, hashed versions from the lock (runtime + dev extra; ruff is pinned
          # there to the pre-commit hook rev). The project itself adds no unlocked dependency.
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
          pip check

      - name: Run migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Lint backend
        working-directory: apps/api
        run: |
          ruff check .

      - name: Backend tool versions
        working-directory: apps/api
        # TC-02-005: record the pinned lint and type checkers.
        run: |
          python --version
          ruff --version
          mypy --version

      - name: Lint backend critical modules
        working-directory: apps/api
        # TC-02-005: pinned rule set on the critical contract modules. The
        # whole-tree `ruff check .` step above stays. This select is E, F, I, B
        # with no per-file ignore. Paths match [tool.mypy] files in pyproject.toml.
        run: >
          ruff check --select E,F,I,B
          app/core/api_errors.py
          app/core/job_errors.py
          app/core/roles.py
          app/schemas/job.py
          app/services/model_outcomes.py
          app/services/source_registry_service.py

      - name: Type-check backend critical modules
        working-directory: apps/api
        # TC-02-005: scope is [tool.mypy] files. A bare `# type: ignore` fails.
        run: mypy

      - name: Safe test collection (TC-02-001)
        # Collection must not touch the network or real credentials; fails on any egress attempt.
        working-directory: apps/api
        run: |
          python -m pytest --collect-only -q
          python -m pytest tests/release/test_safe_collection.py -q

      - name: Python dependency lock (TC-02-002)
        # Installed versions must equal the lock; the app must import and reach the DB through the
        # explicitly installed psycopg2 driver.
        working-directory: apps/api
        env:
          TC_REQUIRE_DB: '1'
        run: python -m pytest tests/release/test_python_lock.py -q

      - name: Install Chromium for integrated inbox acceptance
        working-directory: apps/web
        # Reuse the locked Playwright dependency in the job that already owns
        # PostgreSQL/Python. Missing browser support must fail AC3, not skip it.
        run: npx --no-install playwright install --with-deps chromium

      - name: Run backend tests
        working-directory: apps/api
        env:
          SESSION_SECRET: test-secret
          # Fail (never skip) when the disposable service DB is unavailable or incompatible, and
          # turn any skip of a DB (integration) test into a failure (tests/conftest.py).
          TC_REQUIRE_DB: '1'
          # Fail when the disposable object store is down or a storage test skips.
          TC_REQUIRE_STORAGE: '1'
          # TC-02-006: release tests must execute the web gates, not skip them.
          TC_REQUIRE_WEB_TOOLCHAIN: '1'
          # TC-02-005: release tests must execute ruff, mypy and the DB-free unit suite.
          TC_REQUIRE_API_QUALITY: '1'
        # DATABASE_URL / TC_TEST_DATABASE_URL come from the isolated Postgres step via GITHUB_ENV.
        run: pytest -rs

      - name: Upload integrated inbox restart report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: inbox-restart-acceptance
          path: |
            apps/web/playwright-report/inbox-restart/
            apps/web/test-results/inbox-restart/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload integrated trust requests restart report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: trust-requests-restart-acceptance
          path: |
            apps/web/playwright-report/trust-requests-restart/
            apps/web/test-results/trust-requests-restart/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logout-all browser acceptance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: logout-all-acceptance
          path: |
            apps/web/playwright-report/logout-all/
            apps/web/test-results/logout-all/
          if-no-files-found: warn
          retention-days: 14

      - name: Type-check frontend
        working-directory: apps/web
        run: npm run typecheck

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Audit frontend runtime dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

  # TC-14-001b. Separate job so the build job's web-quality gates and the
  # TC-07-001 secret tree scan stay in place and in order. npm ci --ignore-scripts
  # matches the lockfile policy. No new packages.
  web-release-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Same directory actions/cache restores. Playwright's default on the
      # GitHub-hosted Ubuntu runner is this path; pin it so install and test agree.
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc

      - name: Install frontend deps
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: Frontend tool versions
        working-directory: apps/web
        run: |
          node --version
          npm --version
          npx --no-install playwright --version

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx --no-install playwright install --with-deps chromium

      - name: Run release Playwright specs
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/release-e2e.json
        run: |
          set -euo pipefail
          mkdir -p test-results
          # The specs rewrite these files. Remove the checkout copies first so a
          # stale committed report cannot satisfy the axe gate. The job never commits.
          rm -f ../../artifacts/acceptance/TC-15-049a/axe-*.json
          rm -f ../../artifacts/acceptance/TC-15-039a/axe-*.json
          rm -f ../../artifacts/acceptance/TC-14-001/axe-*.json
          rm -f ../../artifacts/acceptance/TC-14-006/axe-*.json
          rm -f ../../artifacts/acceptance/TC-14-003a/axe-*.json
          rm -f ../../artifacts/acceptance/TC-16-BUG-001/axe-*.json
          rm -f ../../artifacts/acceptance/TC-14-005/axe-*.json
          rm -f ../../artifacts/acceptance/TC-14-006b/axe-*.json
          rm -f ../../artifacts/acceptance/TC-04-001a-web/axe-*.json
          rm -f ../../artifacts/acceptance/TC-04-001b-web/axe-*.json
          rm -f ../../artifacts/acceptance/TC-15-042/axe-*.json
          rm -f ../../artifacts/acceptance/TC-14-008/axe-*.json
          rm -f ../../artifacts/acceptance/TC-15-024/axe-*.json
          rm -f ../../artifacts/acceptance/TC-15-038b/axe-*.json
          rm -f ../../artifacts/acceptance/TC-15-025/axe-*.json

          candidates=(
            e2e/release/screen-deals.spec.ts
            e2e/release/screen-trust-requests.spec.ts
            e2e/release/design-tokens.spec.ts
            e2e/release/responsive-shell.spec.ts
            e2e/release/dialog-toast.spec.ts
            e2e/release/settings-access.spec.ts
            e2e/release/state-components.spec.ts
            e2e/release/drawer-followups.spec.ts
            e2e/release/workspace-create-denied.spec.ts
            e2e/release/workspace-creation-policy.spec.ts
            e2e/release/microcopy-states.spec.ts
            e2e/release/screen-controls.spec.ts
            e2e/release/ui-23.spec.ts
            e2e/release/notification-inbox.spec.ts
            e2e/release/ui-22.spec.ts
            e2e/release/screen-jobs.spec.ts
            e2e/release/email-verification.spec.ts
          )
          for spec in "${candidates[@]}"; do
            if [[ ! -f "$spec" ]]; then
              echo "ERROR: missing release spec: $spec"
              exit 1
            fi
            echo "Running release spec: $spec"
          done

          set +e
          npx --no-install playwright test "${candidates[@]}" --retries=0 --reporter=list,html,json
          playwright_status=$?
          node ../../scripts/ci/check-release-e2e-report.mjs \
            --report test-results/release-e2e.json \
            --html-report playwright-report \
            --axe-dir ../../artifacts/acceptance/TC-15-049a \
            --require-spec e2e/release/screen-deals.spec.ts \
            --min-tests 31 \
            --axe-dir ../../artifacts/acceptance/TC-15-039a \
            --require-spec e2e/release/screen-trust-requests.spec.ts \
            --min-tests 22 \
            --axe-dir ../../artifacts/acceptance/TC-14-001 \
            --axe-dir ../../artifacts/acceptance/TC-14-006 \
            --axe-dir ../../artifacts/acceptance/TC-14-003a \
            --axe-dir ../../artifacts/acceptance/TC-16-BUG-001 \
            --axe-dir ../../artifacts/acceptance/TC-14-006b \
            --axe-dir ../../artifacts/acceptance/TC-14-005 \
            --axe-dir ../../artifacts/acceptance/TC-04-001a-web \
            --axe-dir ../../artifacts/acceptance/TC-04-001b-web \
            --axe-dir ../../artifacts/acceptance/TC-15-042 \
            --require-spec e2e/release/design-tokens.spec.ts \
            --min-tests 4 \
            --require-spec e2e/release/responsive-shell.spec.ts \
            --min-tests 8 \
            --require-spec e2e/release/dialog-toast.spec.ts \
            --min-tests 8 \
            --require-spec e2e/release/settings-access.spec.ts \
            --min-tests 3 \
            --require-spec e2e/release/state-components.spec.ts \
            --min-tests 9 \
            --require-spec e2e/release/drawer-followups.spec.ts \
            --min-tests 3 \
            --require-spec e2e/release/workspace-create-denied.spec.ts \
            --min-tests 8 \
            --require-spec e2e/release/workspace-creation-policy.spec.ts \
            --min-tests 14 \
            --require-spec e2e/release/screen-controls.spec.ts \
            --min-tests 22 \
            --axe-dir ../../artifacts/acceptance/TC-14-008 \
            --require-spec e2e/release/microcopy-states.spec.ts \
            --min-tests 11 \
            --axe-dir ../../artifacts/acceptance/TC-15-025 \
            --require-spec e2e/release/ui-23.spec.ts \
            --min-tests 30 \
            --require-spec e2e/release/notification-inbox.spec.ts \
            --min-tests 7 \
            --axe-dir ../../artifacts/acceptance/TC-15-024 \
            --require-spec e2e/release/ui-22.spec.ts \
            --min-tests 22 \
            --axe-dir ../../artifacts/acceptance/TC-15-038b \
            --require-spec e2e/release/screen-jobs.spec.ts \
            --min-tests 39 \
            --require-spec e2e/release/email-verification.spec.ts \
            --min-tests 4
          checker_status=$?
          set -e
          echo "playwright exit ${playwright_status}; axe check exit ${checker_status}"
          if [[ "$playwright_status" -ne 0 || "$checker_status" -ne 0 ]]; then
            exit 1
          fi

      - name: Upload deals axe JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deals-axe-json
          path: artifacts/acceptance/TC-15-049a/axe-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload incoming trust requests axe JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: incoming-trust-requests-axe-json
          path: artifacts/acceptance/TC-15-039a/axe-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: apps/web/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload axe JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: design-tokens-axe-json
          path: artifacts/acceptance/TC-14-001/axe-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload responsive shell axe JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: responsive-shell-axe-json
          path: artifacts/acceptance/TC-14-006/axe-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload responsive shell screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: responsive-shell-screenshots
          path: artifacts/acceptance/TC-14-006/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload dialog toast axe JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dialog-toast-axe-json
          path: artifacts/acceptance/TC-14-003a/axe-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload settings access axe JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: settings-access-axe-json
          path: artifacts/acceptance/TC-16-BUG-001/axe-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload state components axe JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: state-components-axe-json
          path: artifacts/acceptance/TC-14-005/axe-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload drawer follow-up axe JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: drawer-followups-axe-json
          path: artifacts/acceptance/TC-14-006b/axe-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload workspace creation axe JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: workspace-create-denied-axe-json
          path: artifacts/acceptance/TC-04-001a-web/axe-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload workspace creation policy axe JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: workspace-creation-policy-axe-json
          path: artifacts/acceptance/TC-04-001b-web/axe-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload control screens axe JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: control-screens-axe-json
          path: artifacts/acceptance/TC-15-042/axe-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload microcopy axe JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: microcopy-states-axe-json
          path: artifacts/acceptance/TC-14-008/axe-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload jobs axe JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jobs-axe-json
          path: artifacts/acceptance/TC-15-038b/axe-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload vendor requests axe JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vendor-requests-axe-json
          path: artifacts/acceptance/TC-15-024/axe-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload compliance gaps evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: compliance-gaps-evidence
          path: |
            artifacts/acceptance/TC-15-025/axe-*.json
            artifacts/acceptance/TC-15-025/screenshots/gaps-*.png
            artifacts/acceptance/TC-15-025/screenshots/gap-actions-*.png
          if-no-files-found: warn
          retention-days: 14
