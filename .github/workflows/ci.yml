name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure no secrets files are committed
        run: |
          TRACKED=$(git ls-files | grep -E '^\.env$|^apps/api/\.env$' || true)
          if [ -n "$TRACKED" ]; then
            echo "ERROR: The following env files must not be committed: $TRACKED"
            exit 1
          fi
          echo "No committed .env files found."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Secret inventory tree scan (TC-07-001)
        # Early, dependency-free gate: fails the run on any block finding in tracked files. Output is
        # path, line, rule and kind only (never a value).
        run: python scripts/security/secret_inventory.py tree --root .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # TC-02-003: single source of truth for the frontend Node version.
          node-version-file: apps/web/.nvmrc

      - name: Install frontend deps
        working-directory: apps/web
        # TC-02-003: install exactly the lockfile; no dependency lifecycle scripts.
        run: npm ci --ignore-scripts

      - name: Frontend tool versions
        working-directory: apps/web
        # TC-02-006: record the exact gate toolchain in the CI log.
        run: |
          node --version
          npm --version
          npx --no-install tsc --version
          npx --no-install eslint --version
          npx --no-install prettier --version
          npx --no-install vitest --version

      - name: Lint frontend
        working-directory: apps/web
        run: npm run lint

      - name: Format check frontend
        working-directory: apps/web
        run: npm run format:check

      - name: Unit test frontend
        working-directory: apps/web
        run: npm run test:unit

      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files

      - name: Start isolated Postgres (pgvector) for this run
        # Disposable per-run database: fresh container, throwaway credentials generated here (never
        # committed, masked in logs), migrations applied below, removed when the runner is discarded.
        # Image pinned by digest (PostgreSQL 16.15 + pgvector 0.8.7) - same image family as docker-compose*.yml;
        # plain postgres:16 lacks the vector extension the migrations create.
        env:
          PG_IMAGE: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        run: |
          PG_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PG_PASSWORD"
          PG_DB="tc_ci_${{ github.run_id }}_${{ github.run_attempt }}_test"
          docker run -d --name tc-ci-pg \
            -e POSTGRES_USER=tc_ci -e POSTGRES_PASSWORD="$PG_PASSWORD" -e POSTGRES_DB="$PG_DB" \
            -p 127.0.0.1:5432:5432 "$PG_IMAGE"
          for i in $(seq 1 60); do
            docker exec tc-ci-pg pg_isready -U tc_ci -d "$PG_DB" >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec tc-ci-pg pg_isready -U tc_ci -d "$PG_DB"
          URL="postgresql://tc_ci:$PG_PASSWORD@127.0.0.1:5432/$PG_DB"
          echo "DATABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "TC_TEST_DATABASE_URL=$URL" >> "$GITHUB_ENV"

      - name: Install backend deps
        working-directory: apps/api
        run: |
          pip install -U pip
          # Pin ruff to the pre-commit hook rev (.pre-commit-config.yaml) so both
          # lint gates use the same rules; unpinned ruff pulls newer default rule sets.
          pip install ruff==0.5.6 pytest
          pip install -e .

      - name: Run migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Lint backend
        working-directory: apps/api
        run: |
          ruff check .

      - name: Safe test collection (TC-02-001)
        # Collection must not touch the network or real credentials; fails on any egress attempt.
        working-directory: apps/api
        run: |
          python -m pytest --collect-only -q
          python -m pytest tests/release/test_safe_collection.py -q

      - name: Run backend tests
        working-directory: apps/api
        env:
          SESSION_SECRET: test-secret
          # Fail (never skip) when the disposable service DB is unavailable or incompatible.
          TC_REQUIRE_DB: "1"
          # TC-02-006: release tests must execute the web gates, not skip them.
          TC_REQUIRE_WEB_TOOLCHAIN: "1"
        # DATABASE_URL / TC_TEST_DATABASE_URL come from the isolated Postgres step via GITHUB_ENV.
        run: pytest -rs

      - name: Type-check frontend
        working-directory: apps/web
        run: npm run typecheck

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Audit frontend runtime dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
