repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.6
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        # TC-02-006: runs from the repo root, so point at the app's ignore file explicitly.
        entry: npx --prefix apps/web prettier --check --ignore-path apps/web/.prettierignore
        language: system
        files: ^apps/web/.*\.(ts|tsx|js|jsx|json|md)$
        # Generated and rewritten by `next build`/`next dev` ("should not be edited").
        exclude: ^apps/web/next-env\.d\.ts$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
