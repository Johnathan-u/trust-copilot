[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[project]
name = "trust-copilot-api"
version = "0.1.0"
description = "Trust Copilot FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0,<2.1",  # 2.1 defaults postgresql:// to psycopg3; driver is psycopg2 (full lock: TC-02-002)
    "psycopg2-binary",
    "pydantic",
    "alembic",
    "pgvector",
    "openai",
    "boto3",
    "python-docx",
    "openpyxl",
    "pymupdf",
    "pytest",
    "httpx",
    "python-multipart",
    "python-dotenv",
    "pyotp",
    "cryptography",
    "redis",
    "sentry-sdk[fastapi]",
    "prometheus-client",
    "stripe",
]

[tool.pytest.ini_options]
# TC-02-001: only tests/ is collected and only test_*.py files are test modules. Manual
# live-stack scripts live in scripts/manual_live/ and are never imported by pytest.
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["fixtures", "__pycache__", ".*", "*.egg-info", "scripts", "alembic", "app"]
addopts = "--strict-markers"
markers = [
    "unit: no database, network or app process needed (auto-applied when no integration hint)",
    "integration: tests that require the local test Postgres (skip with -m 'not integration')",
    "provider: calls a real third-party provider; skipped unless TC_ALLOW_PROVIDER_TESTS=1",
    "live_stack: needs a running local stack (API/worker/web); skipped unless TC_LIVE_STACK_TESTS=1",
    "external_data: needs a dataset that is not checked in; skipped with an explicit reason",
]

[tool.ruff]
line-length = 100
